<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F9488"/>
      <stop offset="50%" stop-color="#0B6F66"/>
      <stop offset="100%" stop-color="#E0A930"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B6F66" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#grad)" filter="url(#shadow)"/>
  <!-- Shine overlay -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#shine)"/>
  <!-- D letter -->
  <path d="M38 32 L52 32 C62 32 70 42 70 52 C70 62 62 72 52 72 L38 72 Z" fill="white" opacity="0.95"/>
  <rect x="38" y="32" width="12" height="40" fill="white" opacity="0.95"/>
  <!-- C letter -->
  <path d="M62 32 L80 32 C86 32 90 36 90 42 L90 52 C90 58 86 62 80 62 L78 62" stroke="white" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95"/>
  <!-- Leaf accent -->
  <circle cx="98" cy="18" r="8" fill="#7FAE3A"/>
</svg>